name = "pratulsaini-fyi"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Serve on your own domain. Cloudflare creates the DNS records and the SSL certificate.
routes = [
  { pattern = "pratulsaini.fyi", custom_domain = true },
  { pattern = "www.pratulsaini.fyi", custom_domain = true },
]

# Turn off the *.workers.dev address and per-version preview URLs.
# Those are the URLs where Cloudflare Access was asking you to log in.
workers_dev = false
preview_urls = false

# Static site: files in ./public are served directly.
# Anything else (like /api/spotify) goes to src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Listening data comes from Last.fm. Add your key and username as secrets:
#   npx wrangler secret put LASTFM_API_KEY
#   npx wrangler secret put LASTFM_USER
